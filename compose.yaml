services:
  floci:
    image: floci/floci:1.5.34
    container_name: floci
    ports:
      - "4566:4566"
    networks:
      - floci-net
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: floci-net
      FLOCI_SERVICES_LAMBDA_DOCKER_HOST_OVERRIDE: floci
    volumes:
      - ${PODMAN_SOCKET_PATH:-/run/user/1000/podman/podman.sock}:/var/run/docker.sock:z

networks:
  floci-net:
    name: floci-net
